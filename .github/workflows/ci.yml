name: Funding regression checks

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  funding:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
          python-version: "3.12"
          activate-environment: true
          enable-cache: false
      - name: Install release dependencies and test tools
        run: |
          uv pip install -r requirements.txt -r requirements-hyperopt.txt -e . \
            pytest==9.1.1 pytest-asyncio==1.4.0 pytest-mock==3.15.1 \
            pytest-xdist==3.8.0 pytest-timeout==2.4.0 time-machine==3.4.0 \
            pytest-socket==0.7.0 ruff==0.16.3
      - name: Lint
        run: |
          ruff check freqtrade tests
          ruff format --check freqtrade tests
      - name: Offline financial and data regression tests
        run: |
          pytest -q --timeout=30 --disable-socket --allow-unix-socket \
            tests/exchange/test_kraken*.py tests/exchange/test_exchange.py \
            tests/data/test_converter.py tests/data/test_datahandler.py \
            tests/optimize/test_backtesting.py tests/optimize/test_backtesting_adjust_position.py \
            tests/optimize/test_kraken_funding_backtest.py \
            tests/freqtradebot \
            tests/test_wallets.py tests/test_candle_columns.py tests/persistence/test_persistence.py
